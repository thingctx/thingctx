name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  testpypi:
    name: publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      # Refuse a version TestPyPI already has, rather than skipping the upload.
      # TestPyPI cannot delete, so a reused version silently keeps the OLD build
      # and every job after this one then validates an artifact that is not the
      # one just built. A duplicate has to stop the release, not pass it.
      - name: Refuse to reuse a version already on TestPyPI
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Bounded and retried: an unbounded curl here can wedge the whole
          # release on a DNS or TLS stall. A 404 is the answer we want, so treat
          # only a real HTTP response as authoritative and fail closed otherwise.
          # --write-out prints once per attempt, so keep the last line only. The
          # `|| true` matters: under bash -e -o pipefail a failed curl kills the
          # step at this assignment, so the case below never runs and the release
          # dies with a bare curl error instead of the message that names the fix.
          CODE=$(curl -sS -o /dev/null -w '%{http_code}\n' \
                   --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 2 \
                   "https://test.pypi.org/pypi/thingctx/${VERSION}/json" 2>/dev/null \
                 | tail -n1 || true)
          CODE="${CODE:-000}"
          case "$CODE" in
            404) echo "${VERSION} is free on TestPyPI" ;;
            200)
              echo "::error::thingctx ${VERSION} is already on TestPyPI, so this run" \
                   "would verify that older build. Tag a new version (an rc is fine)."
              exit 1 ;;
            *)
              echo "::error::could not reach TestPyPI to check ${VERSION} (HTTP ${CODE})."
              exit 1 ;;
          esac
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # Prove the *published* TestPyPI artifact is installable on every supported
  # Python and that the offline suite passes against it, not the local tree.
  # Gates the real PyPI publish, so a broken release can't reach the gate.
  smoke:
    name: smoke (TestPyPI)
    needs: testpypi
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install from TestPyPI (retry until index propagates)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Installing thingctx[dev]==${VERSION} from TestPyPI"
          for i in $(seq 1 12); do
            if pip install \
                --index-url https://test.pypi.org/simple/ \
                --extra-index-url https://pypi.org/simple/ \
                "thingctx[dev]==${VERSION}"; then
              break
            fi
            echo "attempt $i: not on TestPyPI yet, waiting 10s..."
            sleep 10
          done
          python -c "import thingctx; assert thingctx.__version__ == '${VERSION}', thingctx.__version__; print('installed', thingctx.__version__)"
      - name: Import optional surfaces
        run: python -c "import thingctx.validate, thingctx.bindings, thingctx.runtime, thingctx.integrations.mcp; print('imports OK')"
      - name: Test installed package (offline, isolated from source)
        run: |
          mkdir -p "$RUNNER_TEMP/t"
          # This job proves the WHEEL works, so it runs from a bare directory with
          # no checkout on sys.path. Any test that reads repo files (examples/,
          # scripts/) cannot pass here and is not about the installed package;
          # ci.yml runs those against the source tree. Selected by what a test
          # actually does, so a new one does not silently break the release.
          cp tests/*.py "$RUNNER_TEMP/t/"
          # No pipeline: grep -l exits 1 when nothing matches, which would fail
          # this step under pipefail once every repo dependent test is gone.
          removed=0
          for f in "$RUNNER_TEMP/t"/test_*.py; do
            if grep -qE "parents\[[0-9]\]|parent\.parent|[\"']examples[\"']|[\"']scripts[\"']|from _pump" "$f"; then
              rm -f "$f"
              removed=$((removed + 1))
            fi
          done
          kept=$(find "$RUNNER_TEMP/t" -name 'test_*.py' -type f | wc -l)
          echo "kept $kept test files, skipped $removed that read repo files"
          if [ "$kept" -lt 50 ]; then
            echo "::error::only $kept test files survived; the filter is too broad"
            exit 1
          fi
          printf '[pytest]\nmarkers = network: hits the network; deselect with -m "not network"\nasyncio_mode = auto\n' > "$RUNNER_TEMP/t/pytest.ini"
          cd "$RUNNER_TEMP/t"
          pytest -m "not network" -q

  # Built BEFORE the PyPI gate so the paused run already carries an installable
  # bundle. Download it from the run's artifacts, install it in Claude Desktop,
  # and dogfood the approve flow before approving the publish. The bundle is a
  # launcher: uv resolves thingctx from PyPI at first launch, so it can only be
  # driven end to end once the publish is approved.
  bundle:
    name: build the Claude Desktop bundle
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Bundle version must match the release tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # A prerelease still ships the release it is a candidate for, so compare
          # against the release version: v0.2.0rc1 must match a 0.2.0 manifest.
          # Only the PEP 440 prerelease markers are stripped. A tag like
          # 0.2.0release1 is not a prerelease of anything and must not pass.
          RELEASE=$(printf '%s' "$TAG" | sed -E 's/(a|b|rc)[0-9]+$//')
          # node, not python3: this job already sets node up for the packer, so
          # reading the manifest with it avoids depending on the runner's python.
          MANIFEST=$(node -p "require('./packaging/mcpb/manifest.json').version")
          if [ "$RELEASE" != "$MANIFEST" ]; then
            echo "::error::manifest.json says $MANIFEST, tag says $TAG (release $RELEASE)"
            exit 1
          fi
          echo "bundle version $MANIFEST matches tag $TAG"
      - run: bash packaging/scripts/build-mcpb.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mcpb
          path: packaging/dist/thingctx.mcpb

  pypi:
    name: publish to PyPI
    needs: [smoke, bundle]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Publish a GitHub Release for the tag after PyPI succeeds. Authored by
  # github-actions[bot] (no personal account), with auto-generated notes and
  # the built artifacts attached.
  github-release:
    name: github release
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mcpb
          path: dist/
      - uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          generate_release_notes: true
          files: dist/*

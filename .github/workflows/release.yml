name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  testpypi:
    name: publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # Prove the *published* TestPyPI artifact is installable on every supported
  # Python and that the offline suite passes against it, not the local tree.
  # Gates the real PyPI publish, so a broken release can't reach the gate.
  smoke:
    name: smoke (TestPyPI)
    needs: testpypi
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install from TestPyPI (retry until index propagates)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Installing thingctx[dev]==${VERSION} from TestPyPI"
          for i in $(seq 1 12); do
            if pip install \
                --index-url https://test.pypi.org/simple/ \
                --extra-index-url https://pypi.org/simple/ \
                "thingctx[dev]==${VERSION}"; then
              break
            fi
            echo "attempt $i: not on TestPyPI yet, waiting 10s..."
            sleep 10
          done
          python -c "import thingctx; assert thingctx.__version__ == '${VERSION}', thingctx.__version__; print('installed', thingctx.__version__)"
      - name: Import optional surfaces
        run: python -c "import thingctx.validate, thingctx.bindings, thingctx.runtime, thingctx.integrations.mcp; print('imports OK')"
      - name: Test installed package (offline, isolated from source)
        run: |
          mkdir -p "$RUNNER_TEMP/t"
          # This job proves the WHEEL works, so it runs from a bare directory with
          # no checkout on sys.path. Any test that reads repo files (examples/,
          # scripts/) cannot pass here and is not about the installed package;
          # ci.yml runs those against the source tree. Selected by what a test
          # actually does, so a new one does not silently break the release.
          cp tests/*.py "$RUNNER_TEMP/t/"
          # No pipeline: grep -l exits 1 when nothing matches, which would fail
          # this step under pipefail once every repo dependent test is gone.
          removed=0
          for f in "$RUNNER_TEMP/t"/test_*.py; do
            if grep -qE "parents\[[0-9]\]|parent\.parent|[\"']examples[\"']|[\"']scripts[\"']|from _pump" "$f"; then
              rm -f "$f"
              removed=$((removed + 1))
            fi
          done
          kept=$(find "$RUNNER_TEMP/t" -name 'test_*.py' -type f | wc -l)
          echo "kept $kept test files, skipped $removed that read repo files"
          if [ "$kept" -lt 50 ]; then
            echo "::error::only $kept test files survived; the filter is too broad"
            exit 1
          fi
          printf '[pytest]\nmarkers = network: hits the network; deselect with -m "not network"\nasyncio_mode = auto\n' > "$RUNNER_TEMP/t/pytest.ini"
          cd "$RUNNER_TEMP/t"
          pytest -m "not network" -q

  # Built BEFORE the PyPI gate so the paused run already carries an installable
  # bundle. Download it from the run's artifacts, install it in Claude Desktop,
  # and dogfood the approve flow before approving the publish. The bundle is a
  # launcher: uv resolves thingctx from PyPI at first launch, so it can only be
  # driven end to end once the publish is approved.
  bundle:
    name: build the Claude Desktop bundle
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Bundle version must match the release tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # node, not python3: this job already sets node up for the packer, so
          # reading the manifest with it avoids depending on the runner's python.
          MANIFEST=$(node -p "require('./packaging/mcpb/manifest.json').version")
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::manifest.json says $MANIFEST, tag says $TAG"
            exit 1
          fi
          echo "bundle version $MANIFEST matches the tag"
      - run: bash packaging/scripts/build-mcpb.sh
      - uses: actions/upload-artifact@v7
        with:
          name: mcpb
          path: packaging/dist/thingctx.mcpb

  pypi:
    name: publish to PyPI
    needs: [smoke, bundle]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Publish a GitHub Release for the tag after PyPI succeeds. Authored by
  # github-actions[bot] (no personal account), with auto-generated notes and
  # the built artifacts attached.
  github-release:
    name: github release
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: mcpb
          path: dist/
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly so the schema-drift check has somewhere to run. It compares the
  # bundled W3C schema against the live one, so it fails when W3C publishes, not
  # when a pull request changes something; gating merges on it would block us on
  # a third party's uptime.
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every commit in a pull request must carry a Developer Certificate of Origin
  # sign-off (Signed-off-by) that matches its author. A real person certifies
  # the contribution; a tool cannot. See CONTRIBUTING.md.
  dco:
    name: dco
    # Bots (Dependabot) cannot add a Signed-off-by; the DCO certifies a human
    # takes responsibility, which does not apply to an automated dependency bump.
    # Gate on the PR author, not the triggering actor: an update-branch or a
    # maintainer action changes the actor, but the author stays the bot.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check sign-off on PR commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            author="$(git show -s --format='%an <%ae>' "$sha")"
            subject="$(git show -s --format='%s' "$sha")"
            if ! git show -s --format='%B' "$sha" | grep -qiE "^Signed-off-by: .+ <.+@.+>"; then
              echo "::error::commit ${sha:0:8} ($subject) has no Signed-off-by. Run: git commit -s --amend"
              fail=1
              continue
            fi
            # The sign-off identity must match the commit author.
            if ! git show -s --format='%B' "$sha" | grep -qiF "Signed-off-by: $author"; then
              echo "::error::commit ${sha:0:8} Signed-off-by does not match author $author"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "DCO check failed. Every commit needs a Signed-off-by matching its author."
            echo "See CONTRIBUTING.md. AI-assisted patches are welcome; a real human must sign off."
            exit 1
          fi
          echo "DCO ok: all PR commits are signed off."

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.14.4"
      - run: ruff check .
      - run: ruff format --check .

  # Types are a promise: py.typed ships, so the annotations must check. mypy runs
  # against the source with the dev extras installed, so the optional-dependency
  # surfaces (httpx, pyjwt, mcp, ...) are typed where the code touches them.
  types:
    name: types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: mypy

  # No dead symbols. vulture flags an unused function/class/variable; the
  # whitelist enumerates the names reached only through indirection (entry points,
  # console scripts) so a genuinely unreferenced symbol fails the job.
  dead-code:
    name: dead-code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install "vulture==2.14"
      - run: vulture

  # Security static analysis, a second gate past ruff's S family. ruff owns the
  # sinks it flags (each carries a reasoned noqa); bandit runs for the checks
  # ruff lacks, chiefly B613 (trojan source). Config lives in [tool.bandit].
  security-lint:
    name: security-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install "bandit==1.9.4"
      - run: bandit -r src/thingctx -c pyproject.toml -q

  # Reuse guard: block the reinvention patterns a codebase audit found worth
  # catching forever (a security value from `random`, a secret compared with
  # ==/!=). The rule list and the rationale for each live in
  # scripts/check_reuse.py.
  reuse-guard:
    name: reuse-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: python3 scripts/check_reuse.py $(git ls-files 'src/**/*.py')

  # Dependency CVE audit against the project's declared dependencies (a `.`
  # audit resolves them fresh), so an optional extra's transitive noise does not
  # mask a real advisory in what ships. The core install is dependency-free.
  deps-audit:
    name: deps-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install "pip-audit==2.9.0"
      - run: pip-audit . --progress-spinner off

  # Architecture fitness function: dependency direction. Fails if an import edge
  # points the wrong way (a lower layer reaching a higher one, or the authz
  # kernel / TD model reaching outward). Contracts in [tool.importlinter]. The
  # package must be importable for the graph build, so install it first.
  architecture:
    name: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install -e . "import-linter==2.3"
      - run: lint-imports

  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test (offline)
        run: pytest -m "not network" -q

  # Branch coverage gate. Runs the offline suite under coverage and fails below
  # the floor in [tool.coverage.report]. Required (wired into ci-ok), so a change
  # that drops coverage below the floor blocks merge. One Python version is
  # enough; the number does not vary across the matrix.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test with branch coverage (fails below the floor)
        run: pytest -m "not network" --cov=thingctx --cov-branch -q

  # The base install must stay dependency-free. Install thingctx with NO extras,
  # import the core and the authorization seam, and fail if any heavy dependency
  # (httpx, pyjwt, azure-identity, cryptography) is reachable from that import.
  # This is the tripwire that keeps thingctx.authz stdlib-only and confines the
  # guard/providers to their extras; a regression that leaks a dep into base
  # breaks this job loudly instead of shipping a heavier core.
  dep-free-base:
    name: dep-free-base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install base only (no extras)
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Import core + authz seam and assert no heavy deps loaded
        run: |
          python - <<'PY'
          import sys
          import importlib.util
          import thingctx
          import thingctx.authz
          from thingctx.authz import pdp, pep, vocabulary, authzen  # noqa: F401
          heavy = [m for m in ("httpx", "jwt", "azure", "cryptography") if m in sys.modules]
          assert not heavy, f"base install leaked heavy deps into import: {heavy}"

          def absent(pkg):
              # find_spec raises ModuleNotFoundError when a parent package is
              # missing (e.g. azure for azure.identity); that means absent.
              try:
                  return importlib.util.find_spec(pkg) is None
              except ModuleNotFoundError:
                  return True

          for pkg in ("httpx", "jwt", "azure.identity"):
              assert absent(pkg), f"{pkg} is installed in a base env; it belongs behind an extra"
          print("dep-free base OK: thingctx + thingctx.authz import stdlib-only")
          PY

  # Single stable gate to require in branch protection, so the matrix can
  # change without touching the protected-branch config.
  # The live-broker half of the suite. `pytest -m "not network"` deselects these,
  # so without this job they never run anywhere and the reconnect/resubscribe
  # behaviour is asserted only against the fake broker. Mosquitto 2 refuses
  # anonymous remote clients under its default config, hence the explicit one.
  mqtt-live:
    name: mqtt-live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Start a broker
        run: |
          printf 'listener 1883 0.0.0.0\nallow_anonymous true\n' > /tmp/mosquitto.conf
          docker run -d --name mosquitto -p 1883:1883 \
            -v /tmp/mosquitto.conf:/mosquitto/config/mosquitto.conf \
            eclipse-mosquitto:2
          for _ in $(seq 30); do
            python -c "import socket,sys; s=socket.create_connection(('127.0.0.1',1883),1); s.close()" 2>/dev/null && exit 0
            sleep 1
          done
          echo "broker never came up"; docker logs mosquitto; exit 1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test (live broker)
        env:
          THINGCTX_MQTT_BROKER: 127.0.0.1:1883
        run: pytest tests/test_mqtt_live_reliability.py -m network -q

  # Drift only appears when W3C republishes, so this runs on the schedule and on
  # demand, and is deliberately absent from ci-ok: a w3.org outage must not block
  # a merge.
  schema-drift:
    name: schema-drift
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Bundled schema still matches the published one
        run: pytest tests/test_schema_current.py -m network -q

  ci-ok:
    name: ci-ok
    if: always()
    needs: [dco, lint, types, dead-code, security-lint, reuse-guard, deps-audit, architecture, test, coverage, dep-free-base, mqtt-live]
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream jobs
        run: |
          # dco runs only on pull_request; a skipped dco (e.g. push to main) is
          # acceptable, a failed one is not.
          if [ "${{ needs.dco.result }}" != "success" ] && [ "${{ needs.dco.result }}" != "skipped" ]; then
            echo "dco=${{ needs.dco.result }}"
            exit 1
          fi
          if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.types.result }}" != "success" ] || [ "${{ needs.dead-code.result }}" != "success" ] || [ "${{ needs.security-lint.result }}" != "success" ] || [ "${{ needs.reuse-guard.result }}" != "success" ] || [ "${{ needs.deps-audit.result }}" != "success" ] || [ "${{ needs.architecture.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.coverage.result }}" != "success" ] || [ "${{ needs.dep-free-base.result }}" != "success" ] || [ "${{ needs.mqtt-live.result }}" != "success" ]; then
            echo "lint=${{ needs.lint.result }} types=${{ needs.types.result }} dead-code=${{ needs.dead-code.result }} security-lint=${{ needs.security-lint.result }} reuse-guard=${{ needs.reuse-guard.result }} deps-audit=${{ needs.deps-audit.result }} architecture=${{ needs.architecture.result }} test=${{ needs.test.result }} coverage=${{ needs.coverage.result }} dep-free-base=${{ needs.dep-free-base.result }} mqtt-live=${{ needs.mqtt-live.result }}"
            exit 1
          fi

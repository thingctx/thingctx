#
# Build, push, and SIGN the gateway image on a release tag. Release-only, never on push.
# The image installs the SAME PyPI artifact everything else resolves to, so its trust
# inherits from the signed/attested PyPI release; cosign + SBOM add image-level proof.
name: release-image

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # push to GHCR
  id-token: write   # cosign keyless (GitHub OIDC)
  attestations: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Derive version from the tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (multi-arch)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: packaging/docker/Dockerfile
          build-args: THINGCTX_VERSION=${{ steps.v.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.IMAGE }}:latest
          sbom: true          # buildkit attaches an SBOM attestation
          provenance: mode=max # SLSA provenance

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign the image (keyless, OIDC)
        run: |
          cosign sign --yes "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

      # A consumer verifies with:
      #   cosign verify ghcr.io/thingctx/thingctx:0.2.0 \
      #     --certificate-identity-regexp 'https://github.com/thingctx/.*' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com

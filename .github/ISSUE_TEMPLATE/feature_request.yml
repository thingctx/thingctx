name: Idea or feature request
description: Something thingctx should be able to do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >
        The problem, not the solution. What system are you pointing an agent at, and
        where does thingctx stop being able to help?
    validations:
      required: true

  - type: textarea
    id: shape
    attributes:
      label: What would it look like
      description: >
        A sketch is enough. If it is a new transport, say which one and whether a
        Python library already speaks it. If it is a change to how a Thing Description
        projects into tools, show the before and after.
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: Which part of thingctx
      options:
        - label: A transport binding (a new protocol to reach)
        - label: The projection from a Thing Description to tool specs
        - label: Authorization, approval, or the trust gate
        - label: The MCP bridge
        - label: Docs or examples
        - label: Not sure

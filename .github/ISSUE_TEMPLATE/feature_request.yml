name: An idea
description: Something thingctx should be able to do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Rough is fine. A half formed idea is easier to talk about than no idea.

  - type: textarea
    id: idea
    attributes:
      label: What are you trying to do
      description: >
        What are you pointing an agent at, and where does thingctx stop helping? The
        problem is more useful than a proposed fix, though bring the fix too if you have one.
    validations:
      required: true

  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Optional. A sketch, a link, a protocol name, an example.
    validations:
      required: false

# Dependency declaration for the Claude Desktop bundle. The host resolves these
# with uv at first launch; nothing is vendored in the bundle itself.
[project]
name = "thingctx-bundle"
version = "0.2.0"
description = "Claude Desktop bundle launcher for the thingctx MCP bridge"
requires-python = ">=3.10"
dependencies = [
  "thingctx[mcp,http,mqtt,media,filesystem,authz]>=0.2,<0.3",
]

[tool.uv]
# The bundle is a launcher, not a package: install only the dependencies.
package = false

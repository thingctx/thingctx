# Run `pre-commit install` once to enable these on every commit.
# See SECURITY.md for the full setup (including the local internal-name guard).
minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-yaml
      - id: check-json
      # The bundled W3C TD 1.1 schema must stay byte-identical to the upstream
      # file (a drift tripwire test asserts it), so the whitespace fixers must
      # not touch it.
      - id: end-of-file-fixer
        exclude: ^src/thingctx/data/td-schema-1\.1\.json$
      - id: trailing-whitespace
        exclude: ^src/thingctx/data/td-schema-1\.1\.json$
      - id: mixed-line-ending
        exclude: ^src/thingctx/data/td-schema-1\.1\.json$
      - id: debug-statements

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # Types and dead-code run from the project's own environment (local hooks), so
  # they see the installed optional dependencies and the [tool.mypy]/[tool.vulture]
  # config in pyproject. Install the dev extra once: pip install -e ".[dev]".
  #
  # These invoke the venv's own tools via a repo-relative path
  # (pre-commit runs hooks with the repo root as cwd). A bare `entry: mypy` with
  # `language: system` resolves against the caller's PATH, so a commit from a
  # shell that has not activated the venv fails with "executable not found"; the
  # `.venv/bin/...` path resolves whether or not the venv is on PATH.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: .venv/bin/mypy
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
      - id: vulture
        name: vulture
        entry: .venv/bin/vulture
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
      # Security static analysis, a second gate past ruff's S family. ruff owns
      # the sinks it flags (each carries a reasoned noqa); bandit runs for the
      # checks ruff lacks, chiefly B613 (trojan source). Config in [tool.bandit].
      - id: bandit
        name: bandit
        entry: .venv/bin/bandit -r src/thingctx -c pyproject.toml -q
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
      # Full offline suite with branch coverage, gated at the floor in
      # [tool.coverage.report]. Pre-push, not pre-commit: the suite is ~32s (push
      # cadence, not commit cadence). CI runs the same command, so the gate is not
      # only local. Skips network-marked tests, same as CI.
      - id: coverage
        name: coverage
        entry: .venv/bin/pytest -m "not network" --cov=thingctx --cov-branch -q
        language: system
        pass_filenames: false
        require_serial: true
        stages: [pre-push]
      # Dependency CVE audit. Scoped to the project's declared dependencies (a
      # `.` audit resolves them fresh), not the ambient dev env, so an optional
      # extra's transitive noise does not mask a real advisory in what ships.
      # Runs on pre-push, not every commit: it resolves the dependency set and
      # queries the advisory database over the network (seconds, not instant),
      # which is push-cadence work. CI runs the same command on every push/PR.
      - id: pip-audit
        name: pip-audit
        entry: .venv/bin/pip-audit . --progress-spinner off
        language: system
        pass_filenames: false
        require_serial: true
        stages: [pre-push]
      # Architecture fitness function: dependency direction. Fails if an import
      # edge points the wrong way (a lower layer reaching a higher one, or the
      # authz kernel / TD model reaching outward). Contracts in [tool.importlinter].
      - id: import-linter
        name: import-linter
        entry: .venv/bin/lint-imports
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

  # Local guard: block internal/private strings. The forbidden list is NOT in
  # this repo (it lives in a gitignored file); without it this hook is a no-op.
  - repo: local
    hooks:
      - id: no-internal-leaks
        name: no internal/private strings
        entry: scripts/check_no_internal_leaks.sh
        language: script
        pass_filenames: true
        require_serial: true
